<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password - English Learning System</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">
  <h2>Forgot Password</h2>

  <p class="alt">Enter your email address and we'll send you a link to reset your password.</p>

  <input type="email" id="email" placeholder="Email Address" />

  <button id="resetLinkBtn">Send Reset Link</button>

  <div class="message" id="message"></div>
  <p class="alt"><a href="login.html">Back to login</a></p>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabaseUrl = "https://drgjjjlseafzsacahokn.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyZ2pqamxzZWFmenNhY2Fob2tuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTQ3MDksImV4cCI6MjA5MDI3MDcwOX0._1uHUCuRtHjSBSTjHOeB4vmcJ_LxirMAKXfVDKAzFK4";

  if (!supabaseUrl || !supabaseKey || supabaseUrl.includes("YOUR_SUPABASE") || supabaseKey.includes("YOUR_SUPABASE")) {
    alert("Please set supabaseUrl / supabaseKey in forgot-password.html before testing.");
  }

  const supabase = createClient(supabaseUrl, supabaseKey);

  const emailInput = document.getElementById("email");
  const resetLinkBtn = document.getElementById("resetLinkBtn");
  const messageDiv = document.getElementById("message");

  // If you are testing locally, run the app through a local server (e.g. Live Server / http://localhost:5500)
  // and add the same URL to Supabase Auth > Settings > Redirect URLs.
  const resetRedirectUrl = window.location.protocol === "file:" 
    ? "http://localhost:5500/reset-password.html"
    : `${window.location.origin}${window.location.pathname.replace(/\/forgot-password\.html$/, "/reset-password.html")}`;

  const accountExists = async (email) => {
    const [learnerResponse, teacherResponse] = await Promise.all([
      supabase.from("learners").select("id").eq("email", email).maybeSingle(),
      supabase.from("teachers").select("id").eq("email", email).maybeSingle()
    ]);

    const learnerFound = !learnerResponse.error && learnerResponse.data !== null;
    const teacherFound = !teacherResponse.error && teacherResponse.data !== null;

    if (learnerResponse.error && teacherResponse.error) {
      return null;
    }
    return learnerFound || teacherFound;
  };

  resetLinkBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();

    if (!email) {
      messageDiv.textContent = "❌ Please enter your email address.";
      return;
    }

    const exists = await accountExists(email);
    if (exists === false) {
      messageDiv.textContent = "❌ Account is not registered as a learner or teacher. Please sign up first.";
      return;
    }
    if (exists === null) {
      messageDiv.textContent = "❌ Unable to verify registration. Please try again later.";
      return;
    }

    resetLinkBtn.disabled = true;
    messageDiv.textContent = "⏳ Sending reset link...";

    try {
      const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: resetRedirectUrl
      });
      if (error) throw error;
      messageDiv.textContent = `✅ Password reset link sent to ${email}. Check your inbox.`;
      emailInput.value = "";
    } catch (err) {
      const message = err?.message || String(err);
      if (message.toLowerCase().includes("user not found") || message.toLowerCase().includes("invalid login credentials")) {
        messageDiv.textContent = "❌ Account does not exist. Please sign up first.";
      } else {
        messageDiv.textContent = "❌ " + message;
      }
    } finally {
      resetLinkBtn.disabled = false;
    }
  });

  // Allow pressing Enter to submit
  emailInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      resetLinkBtn.click();
    }
  });
</script>

</body>
</html>
