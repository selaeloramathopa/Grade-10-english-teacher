<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password - English Learning System</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">
  <h2>Reset Password</h2>

  <p class="alt">Enter your new password below to complete the reset process.</p>

  <input type="password" id="password" placeholder="New Password" />
  <div class="password-checklist" id="passwordChecklist">
    <div class="check-item" id="pwd-length"><span class="status">❌</span> At least 8 characters</div>
    <div class="check-item" id="pwd-lower"><span class="status">❌</span> Lowercase letter</div>
    <div class="check-item" id="pwd-upper"><span class="status">❌</span> Uppercase letter</div>
    <div class="check-item" id="pwd-number"><span class="status">❌</span> Number</div>
    <div class="check-item" id="pwd-symbol"><span class="status">❌</span> Symbol</div>
  </div>
  <input type="password" id="confirmPassword" placeholder="Confirm New Password" />
  <div class="field-error" id="confirmPasswordError"></div>

  <button id="resetBtn">Set New Password</button>

  <div class="message" id="message"></div>
  <p class="alt"><a href="login.html">Back to login</a></p>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabaseUrl = "https://drgjjjlseafzsacahokn.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyZ2pqamxzZWFmenNhY2Fob2tuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTQ3MDksImV4cCI6MjA5MDI3MDcwOX0._1uHUCuRtHjSBSTjHOeB4vmcJ_LxirMAKXfVDKAzFK4";

  if (!supabaseUrl || !supabaseKey || supabaseUrl.includes("YOUR_SUPABASE") || supabaseKey.includes("YOUR_SUPABASE")) {
    alert("Please set supabaseUrl / supabaseKey in reset-password.html before testing.");
  }

  const supabase = createClient(supabaseUrl, supabaseKey);
  const passwordInput = document.getElementById("password");
  const confirmPasswordInput = document.getElementById("confirmPassword");
  const confirmPasswordError = document.getElementById("confirmPasswordError");
  const passwordChecklist = document.getElementById("passwordChecklist");
  const messageDiv = document.getElementById("message");
  const resetBtn = document.getElementById("resetBtn");

  const passwordRules = [
    { id: "pwd-length", test: (value) => value.length >= 8 },
    { id: "pwd-lower", test: (value) => /[a-z]/.test(value) },
    { id: "pwd-upper", test: (value) => /[A-Z]/.test(value) },
    { id: "pwd-number", test: (value) => /\d/.test(value) },
    { id: "pwd-symbol", test: (value) => /[^A-Za-z0-9]/.test(value) }
  ];

  const updatePasswordChecklist = (value) => {
    return passwordRules.every((rule) => {
      const item = document.getElementById(rule.id);
      const passed = rule.test(value);
      item.classList.toggle("passed", passed);
      item.querySelector(".status").textContent = passed ? "✅" : "❌";
      return passed;
    });
  };

  const resetPasswordChecklist = () => {
    passwordRules.forEach((rule) => {
      const item = document.getElementById(rule.id);
      item.classList.remove("passed");
      item.querySelector(".status").textContent = "❌";
    });
  };

  const validateConfirmPassword = () => {
    const password = passwordInput.value;
    const confirm = confirmPasswordInput.value;
    if (!confirm) {
      confirmPasswordError.textContent = "";
      return false;
    }
    if (password !== confirm) {
      confirmPasswordError.textContent = "❌ Passwords do not match.";
      return false;
    }
    confirmPasswordError.textContent = "";
    return true;
  };

  const showFinalMessage = (text) => {
    messageDiv.textContent = text;
  };

  if (window.location.protocol === "file:") {
    showFinalMessage("⚠️ Password reset links do not work reliably from file:// URLs. Please serve this page over http://localhost and add that URL to Supabase Redirect URLs.");
  }

  const init = async () => {
    const { data, error } = await supabase.auth.getSessionFromUrl({ storeSession: true });
    if (error) {
      showFinalMessage("❌ Unable to verify reset link. Please request a new reset from login.");
      return;
    }
    if (!data?.session) {
      showFinalMessage("Please use the password reset link from your email.");
    }
  };

  passwordInput.addEventListener("input", () => {
    const value = passwordInput.value;
    if (value.length > 0) {
      passwordChecklist.style.display = "block";
      updatePasswordChecklist(value);
    } else {
      passwordChecklist.style.display = "none";
      resetPasswordChecklist();
    }
    validateConfirmPassword();
  });

  confirmPasswordInput.addEventListener("input", validateConfirmPassword);

  resetBtn.addEventListener("click", async () => {
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!password || !confirmPassword) {
      showFinalMessage("❌ Please enter and confirm your new password.");
      return;
    }

    if (password !== confirmPassword) {
      showFinalMessage("❌ Passwords do not match.");
      return;
    }

    if (!updatePasswordChecklist(password)) {
      showFinalMessage("❌ Password must meet all strength requirements.");
      return;
    }

    resetBtn.disabled = true;
    showFinalMessage("⏳ Updating password...");

    try {
      const { data, error } = await supabase.auth.updateUser({ password });
      if (error) throw error;
      showFinalMessage("✅ Password updated successfully. You can now log in.");
      setTimeout(() => {
        window.location.href = "login.html";
      }, 1800);
    } catch (err) {
      showFinalMessage("❌ " + (err?.message || String(err)));
    } finally {
      resetBtn.disabled = false;
    }
  });

  init();
</script>

</body>
</html>
