  function openTextbook(filePath) {
    // In a real implementation, this would open the PDF in a new tab or embedded viewer

    link.href = filePath;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  });

    link.addEventListener('click', (e) => {
      // Close sidebar immediately when a menu item is chosen
      sidebar.classList.add('collapsed');
      toggleBtn.classList.add('sidebar-collapsed');

      // Only prevent default for in-page navigation (data-page links)
      if (link.hasAttribute('data-page')) {
        e.preventDefault();
        menuLinks.forEach(item => item.classList.remove('active'));
        link.classList.add('active');
      }
    });
